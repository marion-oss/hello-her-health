name: tests

on:
  pull_request:
    paths:
      - 'api/**'
      - 'package.json'
      - 'vitest.config.ts'
      - '.github/workflows/tests.yml'
  push:
    branches: [main, cloudflare-workers]

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm test
