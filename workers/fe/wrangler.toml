name = "anoqi-app-staging"
main = "src/index.ts"
account_id = "8c0835bd412c69c713ed9eedaaf1ca24"  # Marion@anoqi.health's Account
compatibility_date = "2026-05-01"

# Static Assets — serves the Expo web build as an SPA.
#
# `directory` (./assets) is populated by `npm run build`, which clears the dir
# and runs `npx expo export --platform web --output-dir workers/fe/assets`
# from the repo root. The directory is gitignored — never commit the build.
#
# `not_found_handling = "single-page-application"` makes Static Assets serve
# /index.html for any path not matching a file — required for client-side routing.
[assets]
directory = "./assets"
not_found_handling = "single-page-application"
binding = "ASSETS"
